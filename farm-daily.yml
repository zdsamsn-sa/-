name: 农场每日任务

# 每天 11:15 北京时间（03:15 UTC）自动跑；也可以在 Actions 页点 Run workflow 手动跑
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  farm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install telethon requests
      - name: 跑每日任务（签到 / 收菜 / 重种 / 偷菜）
        run: python farm_daily.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          # 首次调试可以临时加这一行看原始返回，调通后删掉：
          # FARM_DEBUG: "1"
